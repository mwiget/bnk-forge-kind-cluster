kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      # Grafana access.
      - containerPort: 32000
        hostPort: 3000
      # Prometheus access.
      - containerPort: 30000
        hostPort: 8088
  - role: worker
  - role: worker
  - role: worker
networking:
  ipFamily: dual
  # kindnet is the default CNI and is sufficient for the BNK-on-kind v1
  # blueprint (no Multus / macvlan networkAttachments). f5-bnk-udf disables
  # the default and installs Calico+Multus because its lab uses
  # external-net / egress-net macvlan attachments — out of scope here.
  # Re-enable disableDefaultCNI: true and add a CNI module if you later
  # need NetworkAttachmentDefinitions on kind.
